<title>Anatomi Optimus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: tab bar on top. "Anatomi" = full-bleed 3D x-ray bench, instrument columns at the edges, control chain along the bottom. Other tabs = scrolling reference sheets. */
  --bg:#e7e9ec; --panel:rgba(249,250,251,.9); --panel-solid:#f9fafb; --ink:#111418; --ink-2:#535b67; --ink-3:#8a929e; --line:#d2d7dd;
  --accent:#d8142a; --rot:#7656f0; --lin:#1d74dc; --fin:#18935a; --sen:#a87400; --pwr:#ec6a1e; --sig:#3b4452; --hot:#df3f2c; --metal:#5d646e;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1013;--panel:rgba(21,24,29,.88);--panel-solid:#15181d;--ink:#e9ecf1;--ink-2:#a4acb8;--ink-3:#6b7380;--line:#2b3038;--accent:#ff3b4d;--rot:#9b84ff;--lin:#4f9dff;--fin:#36c47c;--sen:#e0b040;--pwr:#ff7a30;--sig:#b9c1cd;--hot:#ff6552;--metal:#8c939d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--panel:rgba(21,24,29,.88);--panel-solid:#15181d;--ink:#e9ecf1;--ink-2:#a4acb8;--ink-3:#6b7380;--line:#2b3038;--accent:#ff3b4d;--rot:#9b84ff;--lin:#4f9dff;--fin:#36c47c;--sen:#e0b040;--pwr:#ff7a30;--sig:#b9c1cd;--hot:#ff6552;--metal:#8c939d;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 10.5px/1.25 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}

/* confidence badges: encoded by form, not colour */
.cf{display:inline-block;font:600 9px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 5px 3px;border-radius:2px;white-space:nowrap;vertical-align:1px}
.cf-R{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.cf-L{border:1px solid var(--ink-2);color:var(--ink)}
.cf-I{border:1px dashed var(--ink-3);color:var(--ink-2);font-style:italic}

.app{height:100%;display:flex;flex-direction:column}
.top{flex:0 0 auto;display:flex;align-items:center;gap:22px;min-height:54px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel-solid);border-bottom:1px solid var(--line);position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .rule{width:4px;height:30px;background:var(--accent)}
.brand h1{font:600 24px/1 var(--f-display);margin:0;letter-spacing:.005em}
.brand h1 span{color:var(--accent)}
.brand p{margin:3px 0 0;font:500 10px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;align-self:stretch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:0 12px;font:600 11px/1 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.top .disc{margin-left:auto;font:500 10px/1.3 var(--f-mono);color:var(--ink-3);text-align:right;flex:0 1 auto;letter-spacing:.03em}
main{flex:1 1 auto;position:relative;min-height:0}

/* ===== Anatomi ===== */
.anat{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#stage.pick{cursor:pointer}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#leaders polyline{fill:none;stroke:var(--ink-2);stroke-width:1}
#leaders circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
#leaders .sel polyline{stroke:var(--accent)}
#leaders .sel circle{stroke:var(--accent);fill:var(--accent)}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:2px 3px;font:600 12.5px/1.1 var(--f-body);color:var(--ink);white-space:nowrap;cursor:pointer;text-align:left;text-shadow:0 0 5px var(--bg),0 0 2px var(--bg),0 0 1px var(--bg)}
.tag small{display:block;margin-top:2px;font:500 9.5px/1.2 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.tag.r{text-align:right}
.tag .ns{display:none}
.tag.sel{color:var(--accent)}
.tag.hov{text-decoration:underline;text-underline-offset:3px}
.tag:focus-visible{outline:2px solid var(--accent)}
.legend{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;font:600 10px/1 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);pointer-events:none;white-space:nowrap;z-index:1}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;background:var(--c)}
.legend i.dash{height:2px;background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 6px)}
#loader{position:absolute;left:50%;top:44px;transform:translateX(-50%);font:500 11px/1 var(--f-mono);letter-spacing:.05em;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);padding:7px 10px;z-index:2;display:flex;gap:10px;align-items:center}
#loader b{display:block;width:90px;height:2px;background:var(--line);position:relative}
#loader b i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}

.col{position:absolute;top:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:2}
.col>*{pointer-events:auto}
.col-left{left:max(16px,env(safe-area-inset-left,0px));width:292px}
.col-right{right:max(16px,env(safe-area-inset-right,0px));width:360px}
.card{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

.readout{padding:11px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.readout .chips{grid-column:1/-1;margin-bottom:8px}
.big{font:700 54px/.86 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font:600 15px/1 var(--f-display);color:var(--ink-2);margin-left:4px;letter-spacing:.04em}
#spark{width:110px;height:44px;display:block}
.plabel{grid-column:1/-1;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.plabel .mono{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line)}
.stats div{min-width:0}
.stats dt{font:600 9.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:2px 0 0;font:500 11px/1.1 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.stats dd b{font:600 19px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}

.parts{flex:1 1 auto;min-height:120px;overflow:auto;padding:4px 0 8px}
.parts h3{margin:10px 14px 3px}
.part{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px;width:100%;padding:5px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.part .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.part .nm{font:500 14px/1.2 var(--f-body);min-width:0}
.part .lv{font:400 10.5px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.part:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.part[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.part[aria-current="true"] .nm{color:var(--accent);font-weight:600}
.part:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel-solid);padding:6px 8px;font:600 10.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;border-radius:2px}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.acc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,.btn:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.detail{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px 16px}
.d-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dom{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.dom i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.detail h2{font:600 30px/1 var(--f-display);margin:8px 0 3px;text-wrap:balance}
.d-en{margin:0;font:500 10.5px/1.3 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.d-role{margin:10px 0 0;font-size:14.5px;line-height:1.45}
.chart{margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.chart-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chart-head .mono{font-size:10px;color:var(--ink-3);text-align:right}
#chart{display:block;width:100%;height:178px;margin-top:6px}
.cap{margin:6px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.detail h3{margin:16px 0 6px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13.5px;line-height:1.45}
.steps li::before{content:counter(s);font:600 11px/20px var(--f-mono);color:var(--accent);text-align:center;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);height:20px;border-radius:50%}
.specs{margin:0;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:0}
.specs>*{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.specs dt{color:var(--ink-2);padding-right:10px}
.specs dd{margin:0;font:500 11.5px/1.4 var(--f-mono);text-align:right;padding-right:8px}
.specs .c{text-align:right}
.ind{display:grid;gap:8px}
.ind div{padding:9px 11px;font-size:13px;line-height:1.45;background:color-mix(in srgb,var(--ink) 5%,transparent);border-left:2px solid var(--ink-3)}
.ind div.dev{border-left-color:var(--fin)}
.ind b{display:block;font:600 9.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.links{display:flex;flex-wrap:wrap;gap:4px}
.keyline{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--ink-2);align-items:center}

.view{padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.view .eyebrow{margin-bottom:-2px}
.credit{font:400 10.5px/1.4 var(--f-body);color:var(--ink-3);margin:0;padding:0 2px}
.credit a{color:var(--ink-2)}

.flowbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;text-align:center;width:calc(100% - 720px);max-width:820px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.flowbar>*{pointer-events:auto}
.fhead{font:600 10.5px/1.2 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:0}
.fhead em{font-style:normal;color:var(--ink-3)}
.chain{display:flex;align-items:flex-start;overflow-x:auto;max-width:100%;padding:4px 2px 2px;scrollbar-width:thin}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;padding:0 1px;width:66px;flex:0 0 auto}
.node .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font:600 10.5px/1 var(--f-mono);background:var(--panel-solid);color:var(--ink-2)}
.node .t{font:600 9.5px/1.15 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.node .v{font:400 9px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.node.pulse .n{border-color:var(--accent);color:var(--ink)}
.node.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
.node.sel .t{color:var(--accent)}
.arr{flex:0 0 auto;width:12px;height:28px;display:grid;place-items:center;color:var(--ink-3);font:600 12px/1 var(--f-mono);margin:0 -5px}
#chainCap{margin:0;max-width:640px;font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 10px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hint{font:500 9.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0}
.anat.ui-off .col,.anat.ui-off .flowbar,.anat.ui-off .legend{opacity:0;pointer-events:none}
.anat.ui-off .col>*,.anat.ui-off .flowbar>*{pointer-events:none}
.col,.flowbar,.legend{transition:opacity .25s}

/* ===== Reference sheets ===== */
.doc{position:absolute;inset:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 72px}
.doc-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.dh{display:flex;flex-direction:column;gap:8px;max-width:760px}
.dh h2{font:600 40px/1 var(--f-display);margin:0;text-wrap:balance}
.dh h2 span{color:var(--accent)}
.lede{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:68ch}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec>h3{font:600 24px/1.05 var(--f-display);margin:0;text-wrap:balance}
.sec>p{margin:0;max-width:72ch;line-height:1.55}
.sec .sub{color:var(--ink-2);font-size:13.5px}
.box{background:var(--panel-solid);border:1px solid var(--line);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--panel-solid)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 10px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:0}
td.n{font:500 12.5px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0}
.lab canvas{display:block;width:100%;height:320px}
.labv{position:relative;min-width:0;overflow:hidden;border-right:1px solid var(--line)}
.labv.is3d canvas{height:400px}
.labv #labGl{cursor:grab;touch-action:none}
.labv #labGl:active{cursor:grabbing}
.labmode{position:absolute;left:12px;top:12px}
.labhint{position:absolute;right:12px;top:16px;margin:0;text-align:right;font:500 10.5px/1.3 var(--f-body);color:var(--ink-3);pointer-events:none}
.labtags{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}
.labtags span{position:absolute;left:0;top:0;white-space:nowrap;font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--panel-solid);border:1px solid var(--line);padding:4px 6px;border-radius:2px}
.labtags span::after{content:"";position:absolute;left:50%;bottom:100%;width:1px;height:var(--l,40px);background:var(--ink-3)}
.labtags span.up::after{bottom:auto;top:100%}
.labnotes span{color:var(--ink-2);font-size:9.5px;letter-spacing:.09em;border-color:transparent}
.labcap{position:absolute;left:14px;bottom:12px;right:14px;pointer-events:none;font:500 12.5px/1.45 var(--f-mono);color:var(--ink)}
.labcap p{margin:0;color:var(--ink-2);font-size:11.5px}
.labcap p.f{color:var(--ink);font-size:12.5px}
.labcap p.t{font:600 9px/1.6 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.labcap p.t.on{color:var(--accent)}
.labcap p.g{color:var(--fin);font-size:10.5px}
.labcap div{display:flex;gap:10px;align-items:baseline;color:var(--c,var(--ink))}
.labcap b{font:600 9px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);min-width:46px}
.labcap small{display:block;margin-top:4px;font:500 10px/1.3 var(--f-body);color:var(--ink-3)}
.lab .ctl{padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rng{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.rng span{font:600 10.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.rng output{font:500 11.5px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.rng input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;background:var(--accent);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border:0;border-radius:0}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.outs dt{font:600 9.5px/1.2 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.outs dd{margin:3px 0 0;font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.outs dd small{font:500 11px/1 var(--f-mono);color:var(--ink-2);margin-left:3px}
.formula{font:500 12px/1.5 var(--f-mono);color:var(--ink-2);margin:0;overflow-wrap:anywhere}
.olist{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
.olist li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;gap:8px;line-height:1.5}
.olist li::before{content:counter(s);font:600 11px/22px var(--f-mono);color:var(--accent);text-align:center;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);height:22px;border-radius:50%}
.svgwrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel-solid)}
.svgwrap svg{display:block;min-width:760px;width:100%;height:auto}
svg text{font-family:var(--f-body);fill:var(--ink)}
svg .t2{fill:var(--ink-2)} svg .t3{fill:var(--ink-3)} svg .tm{font-family:var(--f-mono)}
svg .blk{fill:var(--panel-solid);stroke:var(--ink-3);stroke-width:1}
svg .blk.hi{stroke:var(--ink);stroke-width:1.5}
svg .p52{stroke:var(--pwr);stroke-width:3;fill:none}
svg .plv{stroke:var(--ink-2);stroke-width:1.5;fill:none}
